<!DOCTYPE html><html lang="ru"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Поиск по сайту</title>
    
<link rel="stylesheet" href="/css/styles.min.css?v=1785734014077"></head>
<body>
    <div id="navbar"></div>

    <main class="search-page">
        <div class="search-page-header">
            <h1>Поиск по сайту</h1>
            <form id="searchForm" class="search-page-form" action="/search" method="get" role="search">
                <div class="search-page-group">
                    <input type="text" name="q" class="search-page-input" placeholder="Введите поисковый запрос..." aria-label="Поиск по сайту">
                    <button type="submit" class="search-page-btn">
                        <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"></path></svg>
                        <span>Найти</span>
                    </button>
                </div>
            </form>
        </div>
        <div id="searchResults" class="search-results-container"></div>
        <div class="lightbox-overlay" id="lightboxOverlay" role="dialog" aria-modal="true" aria-label="Просмотр изображения">
        <div class="lightbox-content">
            <button class="lightbox-close" id="lightboxCloseBtn" aria-label="Закрыть"><svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"></path></svg></button>
            <button class="lightbox-nav lightbox-prev" id="lightboxPrevBtn" aria-label="Предыдущее изображение"><svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"></path></svg></button>
            <button class="lightbox-nav lightbox-next" id="lightboxNextBtn" aria-label="Следующее изображение"><svg viewBox="0 0 24 24"><path d="M8.59 16.59L10 18l6-6-6-6-1.41 1.41L13.17 12z"></path></svg></button>
            <img class="lightbox-image" id="lightboxImage" src="" alt="">
            <div class="lightbox-indicators" id="lightboxIndicators"></div>
        </div>
        </div>
    </main>

    <footer id="footer"></footer>
    <script src="/js/bundle.min.js?v=1785734014077"></script>
</body>
</html>
